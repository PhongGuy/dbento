version: 2
updates:
  # Cargo monthly, as one grouped PR. The gpui crates move together with a
  # matching gpui-pilot release, and the vendored crates carry our patches,
  # so both are bumped by hand.
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/tools/dbento-pilot"
    schedule:
      interval: "monthly"
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      - dependency-name: "gpui*"
      - dependency-name: "mongodb"
      - dependency-name: "tiberius"
  # The SHA-pinned workflow actions, monthly, as one grouped PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
