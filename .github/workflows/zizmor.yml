# Audits every workflow with zizmor; findings are fixed rather than suppressed.
name: zizmor

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.2"
          enable-cache: false
      # The token lets the online audits check that each pinned commit belongs to its action.
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.32.0 --format github .github/workflows
