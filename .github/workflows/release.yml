# Builds release artifacts on a v* tag and drafts a GitHub release that a human publishes.
# Build jobs hold no secrets and restore no cache; a tag run signs the update manifest and attests
# every file before drafting.
# A manual run builds a chosen set of platforms; with dry_run it drafts nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build without drafting a release
        type: boolean
        default: true
      platforms:
        description: Comma-separated subset of linux,windows,macos-arm64,macos-intel (macOS bills 10x)
        type: string
        default: linux,windows,macos-arm64

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # GPUI's system libraries for the app, and libclang for pg_query's bindgen.
  LINUX_BUILD_DEPS: pkg-config libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 libegl1 libclang-dev

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.guard.outputs.version }}
      matrix: ${{ steps.guard.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: guard
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          PLATFORMS: ${{ inputs.platforms }}
        run: scripts/release.sh guard "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$DRY_RUN" "$PLATFORMS" >>"$GITHUB_OUTPUT"

  build:
    needs: guard
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.guard.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Marks these binaries as release builds, the only ones the updater may replace.
    env:
      DBENTO_RELEASE_BUILD: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_DEPS
      - name: Install cargo-packager
        run: cargo install --locked cargo-packager --version 0.11.8
      - name: Install cargo-about
        run: cargo install --locked cargo-about --version 0.9.3 --features cli
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: make package
      - name: Build (macOS, Windows)
        if: runner.os != 'Linux'
        run: bash scripts/release.sh build
      - name: Package (macOS, Windows)
        if: runner.os != 'Linux'
        run: bash scripts/release.sh package
      # The notices ship inside every package; the checksums job writes the one SHA256SUMS.
      - name: Drop per-runner loose files
        run: rm -f target/dist/*/SHA256SUMS target/dist/*/THIRD-PARTY-NOTICES.html
      # After packaging, because the macOS package step ad-hoc signs the CLI in place.
      - name: Stage the raw CLI for the updater
        run: bash scripts/release.sh update-cli
      # Rooted at the platform directory, so the merged download in checksums is flat.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: target/dist/${{ runner.os == 'Linux' && 'linux' || runner.os == 'macOS' && 'macos' || 'windows' }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-${{ matrix.target }}
          path: target/update/${{ runner.os == 'Linux' && 'linux' || runner.os == 'macOS' && 'macos' || 'windows' }}/
          if-no-files-found: error

  # Builds the draft body and notes.json from the published release bodies and this tag's generated notes.
  # Its steps are gated rather than the job, so a dry run still reaches checksums.
  notes:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # generate-notes is a Contents write endpoint; it saves nothing
    steps:
      # Full history and tags, so the notes can find the previous tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Write the release notes
        if: github.ref_type == 'tag' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/release-notes.sh files "$GITHUB_REF_NAME" notes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag' && !inputs.dry_run
        with:
          name: notes-${{ needs.guard.outputs.version }}
          path: notes/
          if-no-files-found: error
          # The draft body is unpublished until the release is, so the copy expires with the run.
          retention-days: 1

  # Adds the stable-named copies and SHA256SUMS, writes the unsigned update manifest on a tag release,
  # and hands dist/ and update/ on as one artifact.
  checksums:
    needs: [guard, build, notes]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: update-*
          path: update
          merge-multiple: true
      # Unversioned copies, so the README links /releases/latest/download/<name> directly.
      - name: Add stable-named copies
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: scripts/release.sh stable dist "$VERSION"
      # notes.json joins dist/ before the sums, so SHA256SUMS lists it and the attestation covers it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.ref_type == 'tag' && !inputs.dry_run
        with:
          name: notes-${{ needs.guard.outputs.version }}
          path: notes
      - name: Add the release notes
        if: github.ref_type == 'tag' && !inputs.dry_run
        run: cp notes/notes.json dist/notes.json
      # write_sums is GNU-only, which is why the sums run here and not on the build runners.
      - name: Write SHA256SUMS
        run: scripts/release.sh sums dist
      # Only a release that drafts gets a manifest, so a dry run never signs anything.
      - name: Write the update manifest
        if: github.ref_type == 'tag' && !inputs.dry_run
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: scripts/release.sh manifest dist update "$VERSION" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
      # Two paths root the artifact at the workspace, so it unpacks as dist/ and update/.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.guard.outputs.version }}
          path: |
            dist/
            update/
          if-no-files-found: error

  # Signs latest.json, then attests every release file, so a download verifies with gh attestation verify.
  # It compiles nothing and runs only the distro minisign, base64, jq, coreutils and shell builtins; the signing key
  # lives on the sign step alone. The release environment makes a tag run wait here for the owner's approval.
  attest:
    needs: [guard, checksums]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write # the OIDC token Sigstore signs the attestation with
      attestations: write # store the attestation on the repository
      artifact-metadata: write # link the attestation to the release files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.guard.outputs.version }}
      # From Ubuntu's signed archive at a pinned version, before any step holds a secret.
      - name: Install minisign
        if: hashFiles('update/latest.json') != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends minisign=0.11-1
      # The key secret is a base64 minisign key box; the .sig is the signature box base64-wrapped
      # onto one line. Builtins pipe both secrets, so neither touches disk or a process's arguments.
      - name: Sign the update manifest
        if: hashFiles('update/latest.json') != ''
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          printf '%s\n' "$CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD" |
            minisign -S -s <(printf '%s' "$CARGO_PACKAGER_SIGN_PRIVATE_KEY" | base64 -d) \
              -m update/latest.json -x update/latest.json.minisig
          base64 -w0 update/latest.json.minisig > update/latest.json.sig
          rm update/latest.json.minisig
      # The signed manifest must name this notes.json exactly, within the size cap the client enforces.
      - name: Check the release notes
        if: hashFiles('update/latest.json') != ''
        shell: bash
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          url=$(jq -er .notes_asset.url update/latest.json)
          want_size=$(jq -er .notes_asset.size update/latest.json)
          want_sha=$(jq -er .notes_asset.sha256 update/latest.json)
          size=$(stat -c %s dist/notes.json)
          sha=$(sha256sum dist/notes.json | cut -d' ' -f1)
          [[ $url == */releases/download/v$VERSION/notes.json ]] || { echo "notes_asset url $url is not this release's" >&2; exit 1; }
          [[ $size == "$want_size" ]] || { echo "notes.json is $size bytes, the manifest says $want_size" >&2; exit 1; }
          ((size <= 49152)) || { echo "notes.json is $size bytes, over the 49152 cap" >&2; exit 1; }
          [[ $sha == "$want_sha" ]] || { echo "notes.json sha256 $sha does not match the manifest" >&2; exit 1; }
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*
            update/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-${{ needs.guard.outputs.version }}
          path: |
            dist/
            update/
          if-no-files-found: error

  # Drafts the release from the signed set the attest job attested.
  draft:
    needs: [guard, checksums, attest, notes]
    if: github.ref_type == 'tag' && !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the draft release and upload its files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-${{ needs.guard.outputs.version }}
      # The notes job spliced GitHub's label-grouped notes into the shared layout, so gh is not asked to generate them again.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes-${{ needs.guard.outputs.version }}
          path: notes
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Dbento $VERSION" --notes-file notes/notes.md dist/* update/*
