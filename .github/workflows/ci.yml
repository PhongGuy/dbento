# The gate on every push to master and every pull request. The Linux job runs what
# `make check` runs locally, with a locked Cargo.lock, and also cross-checks Windows and checks
# icons, notices and the release scripts. macOS runs clippy only, since tests need containers.
# A third job checks each engine feature of the core and its shells on its own, and a fourth
# drives the app through the headless gpui-pilot scenarios. A dispatch with `windows` set also
# builds on Windows and runs the updater tests there, the only place its Windows code runs.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      windows:
        description: Also build on windows-latest and run the updater tests there (bills 2x)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  # GPUI's system libraries for the app, and libclang for pg_query's bindgen.
  LINUX_BUILD_DEPS: pkg-config libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 libegl1 libclang-dev

jobs:
  gate:
    runs-on: ubuntu-26.04
    # A cold run of the full suite outlasts an hour; the cache saves only after a green run.
    timeout-minutes: 120
    env:
      # The repository owner accepted the SQL Server Developer licence for this CI job.
      DBENTO_MSSQL_ACCEPT_EULA: "Y"
    steps:
      - name: Free disk space
        # The hosted runner leaves about 14 GB free; these preinstalled toolchains are unused.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # rust-cache keeps this tree's folders but strips its files, which breaks a libduckdb-sys rerun.
      - name: Drop the cached DuckDB sources
        run: rm -rf target/duckdb-sources
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_DEPS gcc-mingw-w64-x86-64
      - name: Install cargo-about
        run: cargo install --locked cargo-about --version 0.9.2 --features cli
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Gate
        run: make LOCKED=--locked workflows-lint script-test check icons-check windows-check notices-check

  macos-clippy:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # rust-cache keeps this tree's folders but strips its files, which breaks a libduckdb-sys rerun.
      - name: Drop the cached DuckDB sources
        run: rm -rf target/duckdb-sources
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -Dwarnings

  each-feature:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # rust-cache keeps this tree's folders but strips its files, which breaks a libduckdb-sys rerun.
      - name: Drop the cached DuckDB sources
        run: rm -rf target/duckdb-sources
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-hack
      - name: Each feature alone
        run: make LOCKED=--locked each-feature

  pilot:
    runs-on: ubuntu-26.04
    # A cold-cache run on a hosted runner builds DuckDB twice and needs a little over 90 minutes.
    timeout-minutes: 120
    env:
      # Session mode needs KDE's KWin, bwrap and AT-SPI in a private desktop, which a hosted
      # runner lacks; those scenarios, like the wheel recordings, stay in the local gate.
      PILOT_SKIP: >-
        --skip the_optimised_app_runs_a_query_in_a_private_session
        --skip the_session_tree_names_the_chrome_and_the_approval_buttons
        --skip open_hands_the_keymap_file_to_xdg_open
        --skip a_stepped_and_clicked_size_field_is_the_one_focused_node
    steps:
      - name: Free disk space
        # The hosted runner leaves about 14 GB free; these preinstalled toolchains are unused.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      # The timing app builds in the root workspace, the pilot and its tests in their own.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            tools/dbento-pilot -> target
      # rust-cache keeps this tree's folders but strips its files, which breaks a libduckdb-sys rerun.
      - name: Drop the cached DuckDB sources
        run: rm -rf target/duckdb-sources tools/dbento-pilot/target/duckdb-sources
      # The runner has no GPU, so GPUI renders headless on mesa's software Vulkan (lavapipe).
      - name: Install build dependencies and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_DEPS mesa-vulkan-drivers
      - name: Check that lavapipe is installed
        run: |
          ls /usr/share/vulkan/icd.d/
          test -n "$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n 1)"
      # gpui-pilot v0.9.1 (gpui-kit 0.11.0), pinned to the tag's commit; rust-cache keeps ~/.cargo/bin.
      - name: Install gpui-pilot
        run: >-
          cargo install --locked gpui-pilot
          --git https://github.com/PhongGuy/gpui-pilot
          --rev cd804591636496dde17a2f0c43e295e4b0207090
      - name: Pilot scenarios
        run: make LOCKED=--locked PILOT_SKIP="$PILOT_SKIP" pilot-check

  # Opt-in, run before a release: the release's Windows build, then the updater tests that
  # need no database, since the runner has no podman.
  windows:
    if: inputs.windows
    runs-on: windows-latest
    # The first cold run sets this; ASSUMED until measured.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # rust-cache keeps this tree's folders but strips its files, which breaks a libduckdb-sys rerun.
      - name: Drop the cached DuckDB sources
        run: rm -rf target/duckdb-sources
      # The features scripts/release.sh ships on Windows.
      - name: Build the CLI and the app
        run: cargo build --locked -p dbento-cli -p dbento-app --no-default-features --features dbento-core/keychain
      - name: Core updater tests
        run: >-
          cargo test --locked -p dbento-core --no-default-features --features keychain,update
          --lib --test integration --
          update:: update_check:: update_config:: update_download::
          update_install:: update_install_kind:: update_manifest:: update_signature::
      # The CLI and app test builds take the test kit's DuckDB, so libduckdb compiles here under cl.exe.
      - name: CLI self-update tests
        run: >-
          cargo test --locked -p dbento-cli --no-default-features --features dbento-core/keychain
          --test integration -- cli_self_update::
      - name: App update tests
        run: >-
          cargo test --locked -p dbento-app --no-default-features --features dbento-core/keychain
          --test integration -- update_arm:: update_banner:: update_quit:: updates::
