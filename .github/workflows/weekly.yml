# Weekly early warning: clippy on the beta toolchain catches new lints before they reach
# stable, and a check after `cargo update` catches dependency breakage before dependabot does.
name: Weekly

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  # GPUI's system libraries for the app, and libclang for pg_query's bindgen.
  LINUX_BUILD_DEPS: pkg-config libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 libegl1 libclang-dev

jobs:
  beta-clippy:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: beta
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # rust-cache keeps this tree's folders but strips its files, which breaks a libduckdb-sys rerun.
      - name: Drop the cached DuckDB sources
        run: rm -rf target/duckdb-sources
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_DEPS
      - name: Clippy on beta
        run: cargo clippy --workspace --all-targets --all-features -- -Dwarnings

  updated-deps:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # rust-cache keeps this tree's folders but strips its files, which breaks a libduckdb-sys rerun.
      - name: Drop the cached DuckDB sources
        run: rm -rf target/duckdb-sources
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_DEPS
      - name: Update dependencies
        run: cargo update
      - name: Check with updated dependencies
        run: cargo check --workspace --all-targets --all-features
