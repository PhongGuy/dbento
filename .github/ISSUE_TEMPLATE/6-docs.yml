name: Documentation
description: Something missing, wrong or unclear in the README or docs.
labels: [docs]
assignees: [PhongGuy]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: File, page or section.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong or missing
    validations:
      required: true
