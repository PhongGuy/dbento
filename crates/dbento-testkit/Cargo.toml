[package]
name = "dbento-testkit"
version.workspace = true
description = "Test-only Postgres, MySQL and SQL Server containers and fresh databases for Dbento"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[dependencies]
testcontainers-modules.workspace = true
tokio-postgres.workspace = true
mysql_async.workspace = true
tiberius.workspace = true
tokio-util.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "net", "io-util"] }
futures-util.workspace = true
rcgen.workspace = true
base64.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
duckdb = { workspace = true, optional = true }
mongodb = { workspace = true, optional = true }
bson = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }
aws-smithy-http-client = { workspace = true, optional = true }

[features]
duckdb = ["dep:duckdb"]
mongodb = ["dep:mongodb", "dep:bson"]
redis = ["dep:redis"]
dynamodb = ["dep:aws-sdk-dynamodb", "dep:aws-smithy-http-client"]

[[test]]
name = "integration"
path = "tests/main.rs"

[[test]]
name = "parallel_start"
path = "tests/parallel_start.rs"

[[test]]
name = "volumes"
path = "tests/volumes.rs"
