[package]
name = "dbento-bench"
version.workspace = true
description = "Release-build measurement of the spec's performance targets"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[dependencies]
dbento-core = { path = "../dbento-core", default-features = false, features = ["keychain"] }
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tempfile.workspace = true

[dev-dependencies]
xtask = { path = "../xtask" }
dbento-testkit = { path = "../dbento-testkit" }
tokio = { workspace = true, features = ["macros", "rt"] }

[[test]]
name = "integration"
path = "tests/main.rs"

# Alone, so no sibling test loads the CPUs while the memory probe reads its high-water mark.
[[test]]
name = "method"
path = "tests/method.rs"
