[package]
name = "xtask"
version.workspace = true
description = "Repository automation for dbento"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
sha2.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# No text or raster images in the SVGs, so fonts and image decoders stay out.
resvg = { version = "=0.48.1", default-features = false }
ico = "=0.5.0"
# PNG slots only; drops the JPEG 2000 codec.
icns = { version = "=0.5.0", default-features = false, features = ["pngio"] }

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true
dbento-core = { path = "../dbento-core", default-features = false, features = ["keychain"] }
dbento-testkit = { path = "../dbento-testkit" }
tokio = { workspace = true, features = ["macros", "rt"] }
