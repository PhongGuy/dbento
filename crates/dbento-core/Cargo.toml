[package]
name = "dbento-core"
version.workspace = true
description = "UI-free core of Dbento: workspace format, secrets and SQL execution"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mysql_async.workspace = true
rusqlite.workspace = true
sqlite3-parser.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
tokio-postgres.workspace = true
pg_query.workspace = true
sqlparser.workspace = true
tiberius.workspace = true
tokio-util.workspace = true
tokio-postgres-rustls.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
futures-util.workspace = true
thiserror.workspace = true
unicode-width.workspace = true
roxmltree.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
toml_edit.workspace = true
humantime.workspace = true
tempfile.workspace = true
dirs.workspace = true
zeroize.workspace = true
pkcs8.workspace = true
aes.workspace = true
cbc.workspace = true
hmac.workspace = true
base64.workspace = true
hex.workspace = true
duckdb = { workspace = true, optional = true }
mongodb = { workspace = true, optional = true }
bson = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
cbor4ii = { workspace = true, optional = true }
half = { workspace = true, optional = true }
keyring-core = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { workspace = true, optional = true }

[features]
default = ["keychain", "duckdb", "mongodb", "surrealdb"]
# The DuckDB engine; it bundles libduckdb, so a build without it skips that C++ compile.
duckdb = ["dep:duckdb"]
# The MongoDB engine: the mongodb driver and bson.
mongodb = ["dep:mongodb", "dep:bson"]
# The SurrealDB engine: a WebSocket client and a CBOR reader, with no SurrealDB crate.
surrealdb = ["dep:tokio-tungstenite", "dep:cbor4ii", "dep:half"]
# The platform keychain as a SecretStore.
keychain = [
    "dep:keyring-core",
    "dep:zbus-secret-service-keyring-store",
    "dep:apple-native-keyring-store",
    "dep:windows-native-keyring-store",
]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }
dbento-testkit = { path = "../dbento-testkit" }
