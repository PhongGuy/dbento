[package]
name = "dbento-core"
version.workspace = true
description = "UI-free core of Dbento: workspace format, secrets and SQL execution"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
mysql_async.workspace = true
rusqlite.workspace = true
sqlite3-parser.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-postgres.workspace = true
pg_query.workspace = true
sqlparser.workspace = true
tiberius.workspace = true
tokio-util.workspace = true
tokio-postgres-rustls.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
futures-util.workspace = true
thiserror.workspace = true
unicode-width.workspace = true
roxmltree.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
toml.workspace = true
toml_edit.workspace = true
tempfile.workspace = true
dirs.workspace = true
zeroize.workspace = true
pkcs8.workspace = true
aes.workspace = true
cbc.workspace = true
hmac.workspace = true
base64.workspace = true
hex.workspace = true
url.workspace = true
dbento-workspace = { path = "../dbento-workspace" }
duckdb = { workspace = true, optional = true }
mongodb = { workspace = true, optional = true }
bson = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-smithy-http-client = { workspace = true, optional = true }
aws-smithy-runtime-api = { workspace = true, optional = true }
cbor4ii = { workspace = true, optional = true }
half = { workspace = true, optional = true }
keyring-core = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
minisign-verify = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
notify-debouncer-full = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { workspace = true, optional = true }
self-replace = { workspace = true, optional = true }

[features]
default = ["keychain", "duckdb", "mongodb", "surrealdb", "redis", "dynamodb", "s3"]
# The DuckDB engine; it bundles libduckdb, so a build without it skips that C++ compile.
duckdb = ["dep:duckdb"]
# The MongoDB engine: the mongodb driver and bson.
mongodb = ["dep:mongodb", "dep:bson", "dbento-testkit/mongodb"]
# The SurrealDB engine: a WebSocket client and a CBOR reader, with no SurrealDB crate.
surrealdb = ["dep:tokio-tungstenite", "dep:cbor4ii", "dep:half", "tokio/macros"]
# The Redis and Valkey engine: redis-rs over tokio and rustls.
redis = ["dep:redis", "dbento-testkit/redis"]
# The DynamoDB engine: the AWS SDK over ring rustls, without aws-config.
dynamodb = [
    "dep:aws-sdk-dynamodb",
    "dep:aws-smithy-http-client",
    "dep:aws-smithy-runtime-api",
    "dbento-testkit/dynamodb",
]
# The S3 object browser: the AWS SDK over ring rustls, without aws-config.
s3 = [
    "dep:aws-sdk-s3",
    "dep:aws-smithy-http-client",
    "dep:aws-smithy-runtime-api",
    "dbento-testkit/s3",
]
# The platform keychain as a SecretStore.
keychain = [
    "dep:keyring-core",
    "dep:zbus-secret-service-keyring-store",
    "dep:apple-native-keyring-store",
    "dep:windows-native-keyring-store",
]
# The self-updater: a signed manifest check and a verified download over ureq.
update = [
    "dep:ureq",
    "dep:minisign-verify",
    "dep:semver",
    "dep:tar",
    "dep:flate2",
    "dep:self-replace",
]
# The workspace folder watcher: debounced notify events turned into a reload signal.
watch = ["dep:notify-debouncer-full"]
# Team mode: a workspace synced with a Potluck server through the git CLI.
team = ["keychain", "dep:ureq"]

# No build script uses these. They give the host crates under the libduckdb-sys and pg_query
# build scripts the features a workspace build gives them, so `-p dbento-core` reuses those build
# scripts' output instead of compiling DuckDB again. scripts/host-features.sh checks they still match.
[build-dependencies]
aho-corasick = "1.1.5"
cc = { version = "1.2.67", features = ["parallel"] }
foldhash = "0.2.0"
libc = "0.2.191"
memchr = "2.8.3"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
regex = "1.13.1"
regex-automata = { version = "0.4.18", default-features = false, features = ["nfa", "perf"] }
serde_core = { version = "1.0.229", features = ["alloc"] }
serde_json = { workspace = true, features = ["preserve_order"] }
syn = { version = "2.0.119", features = ["extra-traits", "fold", "full", "visit", "visit-mut"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "test-util", "time"] }
aws-smithy-types.workspace = true
dbento-testkit = { path = "../dbento-testkit" }
wiremock.workspace = true
minisign.workspace = true
tar.workspace = true
flate2.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

[[test]]
name = "duckdb_stream_memory"
path = "tests/duckdb_stream_memory.rs"

[[test]]
name = "mssql_thread"
path = "tests/mssql_thread.rs"

[[test]]
name = "team"
path = "tests/team/main.rs"
required-features = ["team"]
