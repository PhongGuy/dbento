[package]
name = "dbento-core"
version.workspace = true
description = "UI-free core of Dbento: workspace format, secrets and SQL execution"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
mysql_async.workspace = true
rusqlite.workspace = true
sqlite3-parser.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-postgres.workspace = true
pg_query.workspace = true
sqlparser.workspace = true
tiberius.workspace = true
tokio-util.workspace = true
tokio-postgres-rustls.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
futures-util.workspace = true
thiserror.workspace = true
unicode-width.workspace = true
roxmltree.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
toml.workspace = true
toml_edit.workspace = true
humantime.workspace = true
tempfile.workspace = true
dirs.workspace = true
zeroize.workspace = true
pkcs8.workspace = true
aes.workspace = true
cbc.workspace = true
hmac.workspace = true
base64.workspace = true
hex.workspace = true
url.workspace = true
duckdb = { workspace = true, optional = true }
mongodb = { workspace = true, optional = true }
bson = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }
aws-smithy-http-client = { workspace = true, optional = true }
cbor4ii = { workspace = true, optional = true }
half = { workspace = true, optional = true }
keyring-core = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { workspace = true, optional = true }

[features]
default = ["keychain", "duckdb", "mongodb", "surrealdb", "redis", "dynamodb"]
# The DuckDB engine; it bundles libduckdb, so a build without it skips that C++ compile.
duckdb = ["dep:duckdb"]
# The MongoDB engine: the mongodb driver and bson.
mongodb = ["dep:mongodb", "dep:bson", "dbento-testkit/mongodb"]
# The SurrealDB engine: a WebSocket client and a CBOR reader, with no SurrealDB crate.
surrealdb = ["dep:tokio-tungstenite", "dep:cbor4ii", "dep:half", "tokio/macros"]
# The Redis and Valkey engine: redis-rs over tokio and rustls.
redis = ["dep:redis", "dbento-testkit/redis"]
# The DynamoDB engine: the AWS SDK over ring rustls, without aws-config.
dynamodb = ["dep:aws-sdk-dynamodb", "dep:aws-smithy-http-client"]
# The platform keychain as a SecretStore.
keychain = [
    "dep:keyring-core",
    "dep:zbus-secret-service-keyring-store",
    "dep:apple-native-keyring-store",
    "dep:windows-native-keyring-store",
]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }
dbento-testkit = { path = "../dbento-testkit" }

[[test]]
name = "integration"
path = "tests/main.rs"

[[test]]
name = "duckdb_stream_memory"
path = "tests/duckdb_stream_memory.rs"

[[test]]
name = "mssql_thread"
path = "tests/mssql_thread.rs"

[[test]]
name = "query_files"
path = "tests/query_files.rs"
